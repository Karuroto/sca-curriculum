<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学生成绩查询器 · 广州SCA国际学校</title>
<style>
:root{--bg:#f5f3ee;--surface:#fff;--ink:#232019;--muted:#7a746a;--line:#e5e0d5;
--g9:#0b6a4d;--g8:#2f8f5b;--g7:#7fae4a;--g6:#e0c341;--g5:#eea63a;--g4:#e07b2e;--g2:#c8452f;
--ok:#0b6a4d;--mid:#b7791f;--warn:#c8452f;--sys:#6b5d43;--accent:#7a3e1d;--accent-ink:#fff;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:20px clamp(16px,4vw,48px);}
.htext h1{margin:0;font-size:clamp(20px,2.8vw,26px);}
.htext p{margin:4px 0 0;color:var(--muted);font-size:13px;}
main{padding:24px clamp(16px,4vw,48px) 60px;display:grid;gap:24px;max-width:1000px;margin:0 auto;}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px;}
.step{display:grid;gap:8px;}
.step label{font-weight:700;font-size:14px;color:var(--sys);display:flex;align-items:center;gap:6px;}
.step label .num{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);align-items:center;justify-content:center;font-size:13px;}
select{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:9px;font-size:15px;background:#fbfaf6;color:var(--ink);}
select:focus{outline:2px solid var(--accent);outline-offset:1px;}
select option:disabled{color:var(--muted)}
.pwrow{display:flex;gap:10px;align-items:stretch;}
input[type=password]{flex:1 1 auto;max-width:200px;padding:11px 14px;border:1px solid var(--line);border-radius:9px;font-size:18px;letter-spacing:6px;text-align:center;background:#fbfaf6;color:var(--ink);}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px;}
#pwBtn{padding:11px 22px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:600;cursor:pointer;}
#pwBtn:hover{filter:brightness(1.08)}
.pwmsg{margin:6px 0 0;font-size:13px;min-height:18px;}
.pwmsg.ok{color:var(--ok)}.pwmsg.err{color:var(--warn);font-weight:600}
.pwmsg .recap{color:var(--muted)}
.result{display:none;padding-top:2px;}
.result.show{display:grid;gap:16px;}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;}
.shead h2{margin:0;font-size:22px}
.shead .g{margin:0;color:var(--muted);font-size:14px}
.sum{display:flex;gap:8px 22px;flex-wrap:wrap;background:#f4f0e8;border-radius:10px;padding:12px 16px;font-size:14px;color:var(--muted);}
.sum b{color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;margin-left:4px}
.tablewrap{overflow-x:auto;background:var(--surface);}
table{border-collapse:collapse;width:100%;font-size:14px;}
caption{caption-side:top;text-align:left;padding:10px 2px 8px;font-weight:600;font-size:15px;}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);}
thead th{background:#f1eee7;font-weight:600;white-space:nowrap;}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;}
.badge.a{background:#dff0e6;color:#0b6a4d}
.badge.f{background:#fbe4de;color:#c8452f}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--warn);font-weight:700}
.ranks{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.ranksi{width:14px;height:14px;border-radius:4px;display:inline-block}
.empty{color:var(--muted);padding:18px;text-align:center;background:#faf8f2;border-radius:10px;}
.hint{color:var(--muted);font-size:13px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
footer{border-top:1px solid var(--line);padding:18px clamp(16px,4vw,48px) 36px;color:var(--muted);font-size:13px;max-width:1000px;margin:0 auto;}
@media(max-width:640px){.sum{gap:6px 14px}.shead{flex-direction:column;align-items:flex-start}}
</style></head>
<body>
<header>
  <div class="htext"><h1>🔐 学生成绩查询器 <span style="font-size:14px;color:var(--ok);font-weight:600">（班级密码二次验证）</span></h1>
  <p>广州SCA国际学校 · 2026年10月月考 · 选择班级后需输入该班验证密码，验证通过方可查询本班学生成绩，防止跨班查询</p></div>
</header>
<main>

    <div class="step" id="pwStep" style="display:none"><label><span class="num">2</span>班级验证密码</label>
      <div class="pwrow">

        <button id="pwBtn" type="button">验证</button>
      </div>
      <p class="pwmsg" id="pwMsg"></p>
    </div>
    <div class="step"><label><span class="num">3</span>选择学生</label>
      <select id="stuSel" aria-label="选择学生" disabled><option value="">— 请先验证班级密码 —</option></select>
    </div>
  </div>

  <section class="result" id="result" aria-live="polite"></section>
</main>
<footer>
  <p>说明：① 每个班级设有独立4位数字验证密码，各班班主任仅可查询本班学生，防止跨班查询；② 及格线按学校 SCA 口径 40 分；③ 等级 A*≥90、A≥80、B≥70、C≥60、D≥50、E≥40、40 以下记不及格（U）；④ 一名学生可能同时修读多门课程；⑤ 展示的成绩为该生本次月考所持有的全部科目成绩。</p>
  <div class="legend"><b>等级色标：</b>

</footer>

const GRADES = [["九年级", ["9G1", "9G2"]], ["十年级", ["10G1", "10G2", "10G3", "10D1"]], ["十一年级", ["11A1", "11A2", "11D1"]], ["十二年级", ["12A1", "12A2", "12A3", "12A4", "12D1"]]];
const PW = {"9G1": "9824", "9G2": "0368", "10G1": "9796", "10G2": "3075", "10G3": "5524", "10D1": "9142", "11A1": "2945", "11A2": "3998", "11D1": "2808", "12A1": "8327", "12A2": "0836", "12A3": "9816", "12A4": "3748", "12D1": "8787"};
const LVL = s => s>=90?'A*':s>=80?'A':s>=70?'B':s>=60?'C':s>=50?'D':s>=40?'E':'U';
const PASS = s => s>=40;
const esc = t => String(t).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

// 班级下拉（按年级分组）
const clsSel=document.getElementById('clsSel'), stuSel=document.getElementById('stuSel'), result=document.getElementById('result');
const pwStep=document.getElementById('pwStep'), pwInput=document.getElementById('pwInput'),
      pwBtn=document.getElementById('pwBtn'), pwMsg=document.getElementById('pwMsg');
let verified=false;  // 当前班级是否已验证

let clsHTML='<option value="">— 请选择班级 —</option>';
GRADES.forEach(([g,cs])=>{
  clsHTML+='<optgroup label="'+esc(g)+'">'+cs.map(c=>'<option value="'+c+'">'+esc(c)+'（'+esc(g)+'）</option>').join('')+'</optgroup>';
});
clsSel.innerHTML=clsHTML;

function resetStudent(locked=false){
  stuSel.disabled=true;
  stuSel.innerHTML='<option value="">'+(locked?'— 请先验证班级密码 —':'— 请先选择班级 —')+'</option>';
}

clsSel.addEventListener('change',()=>{
  const c=clsSel.value; verified=false;
  pwInput.value=''; pwMsg.textContent=''; pwMsg.className='pwmsg';
  if(!c){ pwStep.style.display='none'; resetStudent(false); result.classList.remove('show'); result.innerHTML=''; return; }
  pwStep.style.display='grid'; pwInput.focus();
  pwMsg.innerHTML='请输入班级 <b>'+esc(c)+'</b> 的验证密码';
  pwMsg.className='pwmsg';
  resetStudent(true); result.classList.remove('show'); result.innerHTML='';
});

function doVerify(){
  const c=clsSel.value;
  if(!c) return;
  const inp=pwInput.value.trim();
  if(inp.length!==4){
    pwMsg.innerHTML='请输入4位数字密码'; pwMsg.className='pwmsg err'; return;
  }
  if(inp===PW[c]){
    verified=true;
    pwMsg.innerHTML='验证通过 ✅'; pwMsg.className='pwmsg ok';
    stuSel.disabled=false;
    let html='<option value="">— 请选择学生 —</option>';
    DATA[c].students.forEach(s=>{html+='<option value="'+esc(s.n)+'">'+esc(s.n)+'</option>';});
    stuSel.innerHTML=html; stuSel.focus();
  }else{
    verified=false; stuSel.disabled=true;
    pwMsg.innerHTML='密码错误，请重新输入'; pwMsg.className='pwmsg err';
    pwInput.value=''; pwInput.focus();
  }
}
pwBtn.addEventListener('click',doVerify);
pwInput.addEventListener('keydown',e=>{ if(e.key==='Enter') doVerify(); });

stuSel.addEventListener('change',()=>{
  const c=clsSel.value, n=stuSel.value;
  if(!c||!verified||!n){result.classList.remove('show');result.innerHTML='';return;}
  const cls=DATA[c], stu=cls.students.find(s=>s.n===n);
  if(!stu){result.innerHTML='<div class="empty">未找到该学生数据</div>';result.classList.add('show');return;}
  const subs=Object.entries(stu.sub||{}).sort((a,b)=>b[1]-a[1]);
  const cnt=subs.length;
  const avg=cnt? (subs.reduce((a,x)=>a+x[1],0)/cnt):0;
  const passes=subs.filter(x=>PASS(x[1])).length, fails=cnt-passes;
  const best=subs.length? subs[0]:null;
  const worst=subs.length? subs[subs.length-1]:null;
  // 等级分布条
  const dist={}; subs.forEach(x=>{const l=LVL(x[1]);dist[l]=(dist[l]||0)+1;});
  const cols={'A*':'var(--g9)','A':'var(--g8)','B':'var(--g7)','C':'var(--g6)','D':'var(--g5)','E':'var(--g4)','U':'var(--g2)'};
  const order=['A*','A','B','C','D','E','U'];
  const total=Math.max(cnt,1);
  const ranks='<div class="ranks">'+order.map(l=>dist[l]?('<span class="ranksi" style="background:'+cols[l]+'" title="'+l+' '+dist[l]+'门"></span>'):'').join('')+'</div>';
  let rows='';
  subs.forEach(([k,v])=>{
    const l=LVL(v), ok=PASS(v);
    rows+='<tr><td>'+esc(k)+'</td><td class="num">'+v+'</td>'
      +'<td class="num"><span class="badge '+(ok?'a':'f')+'">'+l+'</span></td>'
      +'<td class="num '+(ok?'pass':'fail')+'">'+(ok?'及格':'不及格')+'</td></tr>';
  });
  result.innerHTML=
    '<div class="shead"><h2>'+esc(n)+'</h2><p class="g">'+esc(c)+' · '+esc(cls.grade)+'</p></div>'
    +'<div class="sum">'
    +'<span>科目<b>'+cnt+'</b>门</span>'
    +'<span>平均分<b>'+avg.toFixed(1)+'</b></span>'
    +'<span>及格<b>'+passes+'</b>门</span>'
    +'<span>不及格<b class="'+(fails?'fail':'pass')+'">'+fails+'</b>门</span>'
    +(best?'<span>最高<b>'+esc(best[0])+' '+best[1]+'</b></span>':'')
    +(worst?'<span>最低<b>'+esc(worst[0])+' '+worst[1]+'</b></span>':'')
    +'</div>'
    +'<div class="legend"><b>等级分布：</b>'+ranks+'</div>'
    +'<div class="tablewrap"><table><caption>全部科目成绩</caption>'
    +'<thead><tr><th>科目</th><th class="num">分数</th><th class="num">等级</th><th class="num">Status</th></tr></thead>'
    +'<tbody>'+(rows||'<tr><td colspan="4" class="empty">暂无成绩数据</td></tr>')+'</tbody></table></div>';
  result.classList.add('show');
});
</script>
</body></html>
